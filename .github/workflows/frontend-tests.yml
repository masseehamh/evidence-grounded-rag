name: Frontend regression tests

on:
  push:
    branches: [main]
    paths:
      - "evidence-grounded-rag-frontend/**"
      - ".github/workflows/frontend-tests.yml"
  pull_request:
    paths:
      - "evidence-grounded-rag-frontend/**"
      - ".github/workflows/frontend-tests.yml"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evidence-grounded-rag-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: evidence-grounded-rag-frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
