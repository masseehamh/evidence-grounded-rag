name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend-tests/requirements-test.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Install test dependencies
        run: python -m pip install -r backend-tests/requirements-test.txt

      - name: Download spaCy English model
        run: python -m spacy download en_core_web_sm

      - name: Run backend test suite
        run: python -m pytest backend-tests -q

      - name: Run Cloudflare backend tests
        run: python -m pytest cloudflare-backend-tests/test_backend.py -q

      - name: Run research pilot evaluator tests
        run: python -m unittest discover -s research/pilot -p 'test_*.py' -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: evidence-grounded-rag-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: evidence-grounded-rag-frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: evidence-grounded-rag-frontend
        run: npm test

      - name: Build frontend
        working-directory: evidence-grounded-rag-frontend
        run: npm run build
