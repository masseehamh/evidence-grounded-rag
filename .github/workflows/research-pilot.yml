name: Research pilot (manual)

on:
  workflow_dispatch:
    inputs:
      case_limit:
        description: "Number of illustrative smoke cases to run (1–5)"
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"

permissions:
  contents: read

jobs:
  smoke-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_MODEL: ${{ vars.CLOUDFLARE_MODEL }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate credentials are configured
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Configure CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in repository Actions secrets before running this workflow."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run illustrative smoke experiment
        run: |
          python research/pilot/run_pilot.py \
            --limit "${{ inputs.case_limit }}" \
            --output research/pilot/outputs.jsonl

      - name: Evaluate outputs
        if: always()
        run: |
          if [ -f research/pilot/outputs.jsonl ]; then
            python research/pilot/evaluate_outputs.py \
              --input research/pilot/outputs.jsonl \
              --outdir research/pilot/results
          else
            echo "No output file was produced; the model run may have failed."
          fi

      - name: Upload pilot outputs and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-pilot-${{ github.run_id }}
          path: |
            research/pilot/outputs.jsonl
            research/pilot/results/*.csv
          if-no-files-found: warn
          retention-days: 14
